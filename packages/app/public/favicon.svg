<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- The burn mark on a 16 px grid, so every edge falls on a whole pixel: four burned games, the next one open -->
  <style>
    .burn { fill: #2a211c; }
    .open { fill: none; stroke: #c2470a; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .burn { fill: #eaf0f5; }
      .open { stroke: #ff7a1a; }
    }
  </style>
  <g class="burn">
    <rect x="0" y="1" width="2" height="6" /><rect x="3" y="1" width="2" height="6" />
    <rect x="6" y="1" width="2" height="6" /><rect x="9" y="1" width="2" height="6" />
    <rect x="0" y="9" width="2" height="6" /><rect x="3" y="9" width="2" height="6" />
    <rect x="6" y="9" width="2" height="6" /><rect x="9" y="9" width="2" height="6" />
  </g>
  <g class="open">
    <rect x="12.5" y="1.5" width="2" height="5" /><rect x="12.5" y="9.5" width="2" height="5" />
  </g>
</svg>
